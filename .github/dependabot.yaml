version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/browser-tests"
    registries: "*"
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    ignore:
      # Patch updates generate a lot of noise (security patches will still be included)
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]
      # We handle Node major upgrades separately - @types/node should stay aligned with current major version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # chai v5+ is ESM-only and requires an ESM migration - defer major upgrades until we do that
      - dependency-name: "chai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chai-as-promised"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sinon-chai"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: BAU
    groups:
      chai:
        patterns:
          - "chai"
          - "chai-as-promised"
          - "sinon-chai"
          - "@types/chai"
          - "@types/chai-as-promised"
          - "@types/sinon-chai"
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dev-deploy"
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    ignore:
      # We handle Node major upgrades separately
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: BAU
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    commit-message:
      prefix: BAU
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: daily
      time: "03:00"
    target-branch: main
    labels:
    - dependabot
    commit-message:
      prefix: BAU
    groups:
      pre-commit:
        patterns:
          - "*"
